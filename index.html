<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Textile Technology AI Teacher</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- React & Babel CDNs -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [apiKey, setApiKey] = useState(localStorage.getItem('gemini_api_key') || '');
      const [showKeyModal, setShowKeyModal] = useState(!localStorage.getItem('gemini_api_key'));
      const [query, setQuery] = useState('');
      const [answer, setAnswer] = useState('');
      const [loading, setLoading] = useState(false);
      const [activeTab, setActiveTab] = useState('ask');
      const [savedNotes, setSavedNotes] = useState(JSON.parse(localStorage.getItem('textile_notes') || '[]'));

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [activeTab, answer, loading, showKeyModal]);

      const saveApiKey = (key) => {
        setApiKey(key);
        localStorage.setItem('gemini_api_key', key);
        setShowKeyModal(false);
      };

      const handleAskAI = async (customQuery = null) => {
        const q = customQuery || query;
        if (!q.trim()) return;
        const cleanKey = apiKey.trim();
        if (!cleanKey) {
          setShowKeyModal(true);
          return;
        }

        setLoading(true);
        setAnswer('');

        const systemPrompt = `You are a personal AI Teacher for Diploma in Textile Technology and Textile Engineering students. Provide clear, exam-oriented answers in simple Hindi/Hinglish with English technical terms.
Formatting instructions:
- For Machines: Definition, Working Principle, Main Parts & Functions, Working Mechanism, Advantages, Disadvantages, Applications, and Key Exam Point.
- For Definitions: Definition, Simple Explanation, Exam Point.
- For Differences: Side-by-side comparison table or bullet points.
- For Numericals: Formula, Given Data, Step-by-Step Calculation, Unit, and Final Answer.`;

        try {
        const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=' + encodeURIComponent(cleanKey), {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              contents: [{ role: 'user', parts: [{ text: q }] }],
              systemInstruction: { parts: [{ text: systemPrompt }] },
              generationConfig: {
                temperature: 0.7,
                topK: 40,
                topP: 0.95,
                maxOutputTokens: 2048
              }
            })
          });

          const data = await response.json();

          if (!response.ok) {
            const errorMsg = data.error?.message || `HTTP Error ${response.status}: ${response.statusText}`;
            if (response.status === 400 && errorMsg.toLowerCase().includes('api key')) {
              setAnswer('❌ अमान्य API Key (Invalid API Key)। कृपया अपनी Google AI Studio API Key की जांच करें।');
              setShowKeyModal(true);
            } else if (response.status === 429) {
              setAnswer('⚠️ Quota Exceeded: अनुरोध सीमा समाप्त हो गई है। कृपया थोड़ी देर बाद प्रयास करें।');
            } else {
              setAnswer(`❌ त्रुटि (${response.status}): ${errorMsg}`);
            }
            return;
          }

          if (data.candidates && data.candidates.length > 0) {
            const candidate = data.candidates[0];
            const textPart = candidate.content?.parts?.find(p => p.text)?.text;
            if (textPart) {
              setAnswer(textPart);
            } else if (candidate.finishReason && candidate.finishReason !== 'STOP') {
              setAnswer(`⚠️ उत्तर अधूरा रहा (Reason: ${candidate.finishReason})। कृपया दोबारा पूछें।`);
            } else {
              setAnswer('⚠️ कोई उत्तर प्राप्त नहीं हुआ। कृपया प्रश्न को पुनः लिखकर पूछें।');
            }
          } else {
            setAnswer('⚠️ AI से कोई प्रतिक्रिया प्राप्त नहीं हुई। कृपया अपनी API Key और इंटरनेट कनेक्शन जांचें।');
          }
        } catch (err) {
          console.error('API Error:', err);
          setAnswer(`❌ नेटवर्क त्रुटि (Network Error): AI सर्वर से कनेक्ट नहीं हो सका (${err.message || 'Check connection'})।`);
        } finally {
          setLoading(false);
        }
      };

      const handleSpeak = (text) => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text.replace(/[#*`]/g, '').slice(0, 1000));
          utterance.lang = 'hi-IN';
          window.speechSynthesis.speak(utterance);
        }
      };

      const saveNote = () => {
        if (!answer) return;
        const newNotes = [{ id: Date.now(), title: query || 'Textile Q&A', content: answer }, ...savedNotes];
        setSavedNotes(newNotes);
        localStorage.setItem('textile_notes', JSON.stringify(newNotes));
        alert('नोट्स सफलतापूर्वक सेव हो गए!');
      };

      return (
        <div className="min-h-screen bg-slate-950 flex flex-col md:flex-row pb-12">
          {/* Sidebar */}
          <aside className="w-full md:w-64 bg-slate-900 border-b md:border-b-0 md:border-r border-slate-800 p-4 flex flex-col justify-between">
            <div>
              <div className="flex items-center space-x-3 mb-6 p-2">
                <div className="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
                  <i data-lucide="bot" className="w-6 h-6"></i>
                </div>
                <div>
                  <h1 className="font-bold text-lg leading-tight">Textile AI Teacher</h1>
                  <p className="text-xs text-indigo-400 font-medium">Diploma Study Assistant</p>
                </div>
              </div>

              <nav className="space-y-1">
                {[
                  { id: 'ask', name: 'Ask AI Teacher', icon: 'sparkles' },
                  { id: 'subjects', name: 'Subjects & Topics', icon: 'book-open' },
                  { id: 'exam', name: 'Exam Prep (1/2/5/10M)', icon: 'graduation-cap' },
                  { id: 'lab', name: 'Lab Practicals', icon: 'flask-conical' },
                  { id: 'notes', name: 'My Saved Notes', icon: 'bookmark' },
                ].map((item) => (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium transition ${
                      activeTab === item.id ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'
                    }`}
                  >
                    <i data-lucide={item.icon} className="w-4 h-4"></i>
                    <span>{item.name}</span>
                  </button>
                ))}
              </nav>
            </div>

            <div className="pt-4 border-t border-slate-800 flex items-center justify-between text-xs text-slate-400">
              <span>Textile AI v2.0</span>
              <button onClick={() => setShowKeyModal(true)} className="text-indigo-400 hover:underline">
                API Key
              </button>
            </div>
          </aside>

          {/* Main Area */}
          <main className="flex-1 p-4 md:p-8 max-w-4xl mx-auto w-full">
            {/* API Key Modal */}
            {showKeyModal && (
              <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl">
                  <h3 className="text-lg font-bold text-slate-100 mb-2 flex items-center space-x-2">
                    <i data-lucide="key" className="w-5 h-5 text-indigo-400"></i>
                    <span>Google Gemini API Key</span>
                  </h3>
                  <p className="text-xs text-slate-400 mb-4">
                    ऐप चलाने के लिए अपनी AI Studio की API Key दर्ज करें। यह आपके ब्राउज़र में सुरक्षित रहेगी।
                  </p>
                  <input
                    type="password"
                    defaultValue={apiKey}
                    id="apiInput"
                    placeholder="AIzaSy..."
                    className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 mb-4"
                  />
                  <div className="flex space-x-2">
                    <button
                      onClick={() => saveApiKey(document.getElementById('apiInput').value)}
                      className="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-xl transition text-sm shadow-lg shadow-indigo-600/30"
                    >
                      Save & Continue
                    </button>
                    {apiKey && (
                      <button
                        onClick={() => setShowKeyModal(false)}
                        className="bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium px-4 py-2.5 rounded-xl text-sm"
                      >
                        Cancel
                      </button>
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* Content per Tab */}
            {activeTab === 'ask' && (
              <div className="space-y-6">
                <div className="bg-gradient-to-br from-indigo-900/50 via-slate-900 to-slate-900 border border-indigo-500/20 rounded-2xl p-6 shadow-xl">
                  <h2 className="text-xl font-bold text-white mb-2 flex items-center space-x-2">
                    <i data-lucide="sparkles" className="w-5 h-5 text-indigo-400"></i>
                    <span>अपना Textile Technology Question पूछें</span>
                  </h2>
                  <p className="text-xs text-slate-400 mb-4">
                    Kirschner Beater, Blow Room, Rapier Loom, Uster Tester, Spinning, या Weaving से संबंधित कोई भी प्रश्न पूछें।
                  </p>

                  <div className="relative">
                    <textarea
                      value={query}
                      onChange={(e) => setQuery(e.target.value)}
                      placeholder="उदाहरण: Carding machine ke main parts aur working principle explain karo..."
                      rows="3"
                      className="w-full bg-slate-950/80 border border-slate-700 rounded-xl p-4 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 resize-none shadow-inner"
                    />
                    <div className="flex justify-between items-center mt-3">
                      <div className="flex space-x-2">
                        {['Spinning', 'Weaving', 'Carding Draft', 'Testing'].map((tag) => (
                          <button
                            key={tag}
                            onClick={() => {
                              setQuery(`${tag} ke important exam notes batao.`);
                              handleAskAI(`${tag} ke important exam notes batao.`);
                            }}
                            className="text-xs bg-slate-800/80 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded-full border border-slate-700"
                          >
                            {tag}
                          </button>
                        ))}
                      </div>
                      <button
                        onClick={() => handleAskAI()}
                        disabled={loading}
                        className="bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white font-medium px-5 py-2.5 rounded-xl transition text-sm flex items-center space-x-2 shadow-lg shadow-indigo-600/30"
                      >
                        {loading ? (
                          <>
                            <i data-lucide="loader-2" className="w-4 h-4 animate-spin"></i>
                            <span>सोच रहा है...</span>
                          </>
                        ) : (
                          <>
                            <span>उत्तर पाएँ</span>
                            <i data-lucide="send" className="w-4 h-4"></i>
                          </>
                        )}
                      </button>
                    </div>
                  </div>
                </div>

                {/* Answer Box */}
                {answer && (
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
                    <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                      <div className="flex items-center space-x-2 text-indigo-400 font-semibold text-sm">
                        <i data-lucide="bot" className="w-4 h-4"></i>
                        <span>Diploma Exam Oriented Solution</span>
                      </div>
                      <div className="flex space-x-2">
                        <button
                          onClick={() => handleSpeak(answer)}
                          title="बोलकर सुनें"
                          className="p-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg transition"
                        >
                          <i data-lucide="volume-2" className="w-4 h-4"></i>
                        </button>
                        <button
                          onClick={saveNote}
                          title="नोट्स सेव करें"
                          className="p-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg transition"
                        >
                          <i data-lucide="bookmark" className="w-4 h-4"></i>
                        </button>
                      </div>
                    </div>
                    <div className="prose prose-invert max-w-none text-slate-300 text-sm whitespace-pre-wrap leading-relaxed">
                      {answer}
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* Saved Notes Tab */}
            {activeTab === 'notes' && (
              <div className="space-y-4">
                <h2 className="text-xl font-bold text-white flex items-center space-x-2">
                  <i data-lucide="bookmark" className="w-5 h-5 text-indigo-400"></i>
                  <span>मेरे सेव किए गए नोट्स ({savedNotes.length})</span>
                </h2>
                {savedNotes.length === 0 ? (
                  <p className="text-sm text-slate-400">अभी तक कोई नोट्स सेव नहीं किए गए हैं।</p>
                ) : (
                  savedNotes.map((note) => (
                    <div key={note.id} className="bg-slate-900 border border-slate-800 rounded-xl p-4">
                      <h4 className="font-semibold text-indigo-300 text-sm mb-2">{note.title}</h4>
                      <p className="text-xs text-slate-300 whitespace-pre-wrap line-clamp-4">{note.content}</p>
                    </div>
                  ))
                )}
              </div>
            )}

            {/* Other tabs quick view */}
            {activeTab !== 'ask' && activeTab !== 'notes' && (
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                <h2 className="text-lg font-bold text-white mb-2 capitalize">{activeTab} Section</h2>
                <p className="text-sm text-slate-400 mb-4">इस सेक्शन के त्वरित प्रश्नों के लिए नीचे क्लिक करें:</p>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  {[
                    'Yarn Count Systems & Conversion Formula',
                    'Carding Machine Draft Calculations',
                    'Loom Shedding, Picking, Beating Mechanisms',
                    'Fiber Length Testing by Baer Sorter',
                  ].map((topic) => (
                    <button
                      key={topic}
                      onClick={() => {
                        setActiveTab('ask');
                        setQuery(topic);
                        handleAskAI(topic);
                      }}
                      className="text-left bg-slate-950 hover:bg-indigo-950/40 border border-slate-800 p-3 rounded-xl text-xs text-slate-300 transition"
                    >
                      👉 {topic}
                    </button>
                  ))}
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
